<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#030712"><title>BoxOffice Mojo — Live Chat</title><link rel="icon" href="favicon.ico"><link rel="stylesheet" href="styles/app.css"><script>try{const u=JSON.parse(localStorage.getItem('bo_user')||sessionStorage.getItem('bo_user')||'null'),t=localStorage.getItem('bo_token')||sessionStorage.getItem('bo_token');if(!u||u.role!=='client'||!t)location.replace('login.html')}catch{location.replace('login.html')}</script></head><body class="live-chat-page"><main class="live-chat-shell"><header class="live-chat-header"><div class="agent-profile"><div class="agent-avatar-wrap"><img id="agentAvatar" src="assets/support-agent.png" class="agent-avatar" alt="Support Agent"><span class="agent-online"></span></div><div class="agent-copy"><strong id="agentName">Support Agent</strong><span id="agentStatus">Online · Ready to help</span></div></div><button id="chatClose" class="chat-close" type="button" aria-label="Close live chat">×</button></header><section id="messages" class="live-message-list" aria-live="polite"></section><form id="send" class="live-chat-composer"><div id="attachmentPreview" class="attachment-preview" hidden></div><div class="composer-row"><button id="attachButton" class="attach-button" type="button" aria-label="Attach a file">⌇</button><input id="file" type="file" accept="image/*,.pdf,.txt,.zip" hidden><input id="text" class="chat-message-input" type="text" autocomplete="off" placeholder="Type a message..." aria-label="Type a message"><button class="send-button" type="submit" aria-label="Send message"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 3 10.2 13.8"/><path d="m21 3-6.9 18-3.9-7.2L3 9.9 21 3Z"/></svg></button></div></form></main><script src="config.js"></script><script type="module">
import{guard,api,apiForm,apiBase}from'./scripts/common.js';
const user=guard('client');
if(user){
 const messages=document.getElementById('messages');
 const send=document.getElementById('send');
 const text=document.getElementById('text');
 const file=document.getElementById('file');
 const preview=document.getElementById('attachmentPreview');
 const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const formatTime=value=>{try{return new Date(value).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})}catch{return ''}};
 const closeChat=()=>{if(history.length>1)history.back();else location.href='profile.html'};
 document.getElementById('chatClose').onclick=closeChat;
 document.getElementById('attachButton').onclick=()=>file.click();
 file.onchange=()=>{const f=file.files?.[0];if(!f){preview.hidden=true;preview.textContent='';return}preview.hidden=false;preview.innerHTML=`<span>📎 ${escapeHtml(f.name)}</span><button id="removeAttachment" type="button" aria-label="Remove attachment">×</button>`;document.getElementById('removeAttachment').onclick=()=>{file.value='';preview.hidden=true;preview.textContent=''}};
 const loadSupport=async()=>{try{const d=await api('/client/dashboard');const s=d.support||d.supportSettings||d.settings?.support||{};const name=s.agentName||s.name||s.contactName||'Support Agent';document.getElementById('agentName').textContent=name;document.getElementById('agentStatus').textContent=s.statusText||'Online · Ready to help';if(s.avatarUrl)document.getElementById('agentAvatar').src=s.avatarUrl}catch{}}
 const render=async(scroll=true)=>{const result=await api('/messages/client');const list=Array.isArray(result)?result:(result.messages||result.items||result.data||[]);messages.innerHTML=list.map(m=>{const mine=m.fromRole==='client'||m.senderRole==='client'||m.role==='client';const attachment=m.attachment?`<a class="chat-attachment" href="${escapeHtml(apiBase(m.attachment.url))}" target="_blank" rel="noopener">📎 ${escapeHtml(m.attachment.name||'Attachment')}</a>`:'';return `<article class="live-message ${mine?'mine':'agent'}"><div class="message-bubble">${m.text?`<p>${escapeHtml(m.text)}</p>`:''}${attachment}<time>${formatTime(m.createdAt)}</time></div></article>`}).join('')||`<div class="chat-empty"><div class="empty-icon">💬</div><strong>Hi there!</strong><span>Send us a message and our support team will be happy to help.</span></div>`;if(scroll)messages.scrollTop=messages.scrollHeight};
 send.onsubmit=async e=>{e.preventDefault();const value=text.value.trim();const f=file.files?.[0];if(!value&&!f)return;if(f&&f.size>8*1024*1024){alert('Maximum file size is 8 MB.');return}let fileData=null;if(f)fileData=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(f)});const button=send.querySelector('.send-button');button.disabled=true;try{await apiForm('/messages/client',{text:value,fileData,fileName:f?.name||''});text.value='';file.value='';preview.hidden=true;preview.textContent='';await render()}catch(err){alert(err.message)}finally{button.disabled=false;text.focus()}};
 await loadSupport();try{await render()}catch(err){messages.innerHTML=`<div class="chat-error">${escapeHtml(err.message||'We could not load the chat right now.')}</div>`}setInterval(async()=>{if(document.visibilityState==='visible')try{await render(false)}catch{}},5000);text.focus();
}
</script></body></html>
