<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0f14"><title>BoxOffice Mojo — Tasks</title><link rel="icon" href="favicon.ico"><link rel="stylesheet" href="styles/app.css"><script>try{const u=JSON.parse(localStorage.getItem('bo_user')||sessionStorage.getItem('bo_user')||'null'),t=localStorage.getItem('bo_token')||sessionStorage.getItem('bo_token');if(!u||u.role!=='client'||!t)location.replace('login.html')}catch{location.replace('login.html')}</script></head><body class="app-shell"><header class="topbar client-header"><img src="logo.png" class="brand-mini" alt="Box Office Mojo by IMDbPro"></header><main class="container client-content"><div class="section-head"><div><span class="kpi">OPERATIONS</span><h1 class="section-title">Tasks</h1></div><button class="btn secondary" id="resetBtn" type="button">Reset Set</button></div><section class="vip-banner card"><div><span class="kpi">CURRENT LEVEL</span><strong id="vipLevel">—</strong><span id="vipBalance">Working balance required</span></div><div class="vip-meta"><b id="vipRate">0.00%</b><span id="vipProducts">0 products</span><span id="vipResets">0 resets left</span></div></section><section class="card task-card"><div class="wallet-stat"><span class="kpi">TASK SET PROGRESS</span><b id="count">0 / 0</b><div class="task-progress"><i id="progress"></i></div></div><form id="task"><label class="field"><span>Task Amount</span><input class="light-input" name="amount" type="number" min="0.01" step="0.01" placeholder="0.00" required></label><label class="field"><span>Task Title</span><input class="light-input" name="title" value="Optimization Task" maxlength="160" required></label><div class="commission-preview"><span>Expected commission</span><strong id="preview">USD 0.00</strong></div><button class="btn" type="submit">Start Task</button></form><div id="msg" class="notice" style="display:none"></div></section></main><div id="bottom"></div><script src="config.js"></script><script type="module">import{guard,api,nav}from'./scripts/common.js';const u=guard('client');if(u){document.getElementById('bottom').innerHTML=nav('tasks');const $=id=>document.getElementById(id);let tier=null;let max=0;const money=n=>'USD '+Number(n||0).toFixed(2);const render=d=>{tier=d.vipTier;max=Number(d.stats?.totalTasks||tier?.products||0);$('vipLevel').textContent=tier?.level||'NOT ELIGIBLE';$('vipBalance').textContent=tier?`Start working with USD ${Number(tier.minBalance).toFixed(2)}`:'Minimum working balance: USD 100.00';$('vipRate').textContent=tier?(tier.rate*100).toFixed(2)+'%':'0.00%';$('vipProducts').textContent=max+' products';$('vipResets').textContent=(d.stats?.resetsRemaining||0)+' resets left';const n=Number(d.stats?.completedToday||0);$('count').textContent=`${n} / ${max}`;$('progress').style.width=Math.min(100,max?n/max*100:0)+'%';const amount=Number(document.querySelector('[name=amount]').value||0);$('preview').textContent=money(amount*(tier?.rate||0));$('resetBtn').disabled=!tier||!(d.stats?.resetsRemaining>0)};const load=async()=>render(await api('/client/dashboard'));document.querySelector('[name=amount]').oninput=()=>{const amount=Number(document.querySelector('[name=amount]').value||0);$('preview').textContent=money(amount*(tier?.rate||0))};$('resetBtn').onclick=async()=>{try{render(await api('/orders/client/reset',{method:'POST'}));$('msg').textContent='Task set reset successfully.';$('msg').className='notice success';$('msg').style.display='block'}catch(e){$('msg').textContent=e.message;$('msg').className='notice error';$('msg').style.display='block'}};$('task').onsubmit=async e=>{e.preventDefault();const submit=e.submitter;submit.disabled=true;try{const d=await api('/orders/client',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e)))});$('msg').textContent=`Task submitted. ${d.vipLevel} commission is ${(Number(d.commissionRate)*100).toFixed(2)}%.`;$('msg').className='notice success';$('msg').style.display='block';e.reset();e.elements.title.value='Optimization Task';render(await api('/client/dashboard'))}catch(x){$('msg').textContent=x.message;$('msg').className='notice error';$('msg').style.display='block'}finally{submit.disabled=false}};load().catch(e=>{$('msg').textContent=e.message;$('msg').className='notice error';$('msg').style.display='block'})}</script></body></html>
