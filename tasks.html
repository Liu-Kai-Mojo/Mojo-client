<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050a10"><title>BoxOffice Mojo — Tasks</title><link rel="icon" href="favicon.ico"><link rel="stylesheet" href="styles/app.css"></head><body class="app-shell"><header class="topbar client-header"><img src="assets/brand-logo.png" class="brand-mini" alt="Box Office Mojo by IMDbPro"></header><main class="container client-content"><div class="section-head"><div><span class="kpi">Operations</span><h1 class="section-title">Tasks</h1></div></div><section class="card task-card"><div class="wallet-stat"><span class="kpi">Completed Optimization Tasks</span><b id="count">0 / 30</b><div class="task-progress"><i id="progress"></i></div></div><form id="task"><label class="field"><span>Task Amount</span><input class="light-input" name="amount" type="number" min="1" step="0.01" placeholder="0.00" required></label><label class="field"><span>Task Title</span><input class="light-input" name="title" value="Optimization Task" required></label><button class="btn" type="submit">Start Task</button></form><div id="msg" class="notice" style="display:none"></div></section></main><div id="bottom"></div><script src="config.js"></script><script type="module">import{guard,api,nav}from'./scripts/common.js';if(guard('client')){document.getElementById('bottom').innerHTML=nav('tasks');const load=async()=>{const d=await api('/client/dashboard');const n=Number(d.stats?.taskCount||0),t=Number(d.stats?.totalTasks||30);count.textContent=`${n} / ${t}`;progress.style.width=Math.min(100,t? n/t*100:0)+'%'};task.onsubmit=async e=>{e.preventDefault();try{await api('/orders/client',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(task)))});msg.textContent='Task submitted successfully.';msg.className='notice success';msg.style.display='block';task.reset();task.elements.title.value='Optimization Task';await load()}catch(e){msg.textContent=e.message;msg.className='notice error';msg.style.display='block'}};load()}}</script></body></html>
