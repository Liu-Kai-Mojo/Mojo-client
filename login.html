<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050a10"><title>BoxOffice Mojo — Client Login</title><link rel="icon" href="favicon.ico"><link rel="stylesheet" href="styles/app.css"></head><body class="auth-page"><div class="auth-slideshow" data-auth-slideshow data-poster-base="assets/auth/" aria-hidden="true"></div><main class="auth-layout"><div class="auth-utilities"><a class="auth-utility-button" href="support.html" aria-label="Customer Service" title="Customer Service"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13a8 8 0 0 1 16 0v4a2 2 0 0 1-2 2h-2.5v-6H20M4 13v4a2 2 0 0 0 2 2h2.5v-6H4m8-8v2"/></svg></a><button class="auth-utility-button auth-language-button" type="button" data-language-button aria-label="Language" title="Language"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.5 3.7 5.5 3.7 9S14.5 19.5 12 21c-2.5-1.5-3.7-4.5-3.7-9S9.5 5.5 12 3Z"/></svg></button></div><header class="auth-topbar"><img src="assets/auth/brand-logo.png" class="auth-logo" alt="Box Office Mojo by IMDbPro"></header><div class="auth-register-prompt"><span>New to BoxOffice?</span><a class="register-cta" href="register.html">REGISTER</a></div><section class="auth-box"><h1 class="auth-title">Welcome Back</h1><p class="auth-sub">Good to see you again. Sign in to continue.</p><form id="loginForm" novalidate><div class="field"><label>Phone Number</label><input class="input" name="email" type="text" inputmode="tel" autocomplete="username" placeholder="Type your number" required></div><div class="field"><label>Password</label><div class="password-wrap"><input id="passwordInput" class="input" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required><button class="password-toggle" type="button" data-password-toggle aria-label="Show password"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="2.6"/></svg></button></div></div><div class="auth-options"><label class="remember"><input id="rememberMe" type="checkbox"> Remember me</label><a class="forgot-link" href="support.html">Forgot password?</a></div><div id="msg" class="auth-message" role="alert"></div><button class="btn" type="submit">Login Now</button></form></section></main><script src="config.js"></script><script type="module" src="scripts/auth.js"></script><script src="assets/auth/slideshow.js"></script><script src="scripts/auth-ui.js"></script><script>const p=document.getElementById('passwordInput'),b=document.querySelector('[data-password-toggle]');b.onclick=()=>{const show=p.type==='password';p.type=show?'text':'password';b.setAttribute('aria-label',show?'Hide password':'Show password')}</script></body></html>
