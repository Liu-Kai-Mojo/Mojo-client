<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050a10"><title>BoxOffice Mojo — Account</title><link rel="icon" href="favicon.ico"><link rel="stylesheet" href="styles/app.css"></head><body class="app-shell"><header class="topbar client-header"><img src="assets/brand-logo.png" class="brand-mini" alt="Box Office Mojo by IMDbPro"></header><main class="container client-content"><div class="section-head"><div><span class="kpi">Profile</span><h1 class="section-title">Account</h1></div></div><section class="client-profile"><img src="assets/brand-logo.png" class="client-avatar" alt="Box Office Mojo"><div><h2 id="name" style="margin:0 0 6px;font-size:clamp(22px,4vw,30px)">Client</h2><div class="muted">UID <b id="uid">—</b></div></div></section><section class="card" style="margin-top:14px"><div class="detail-grid"><div class="detail"><span>Invitation Code</span><strong id="invite">—</strong></div><div class="detail"><span>Credit Score</span><strong id="credit">1000</strong></div><div class="detail"><span>Commission</span><strong id="commission">USD 0.00</strong></div></div><div class="account-actions" style="margin-top:14px"><a class="btn ghost" href="support.html">Customer Service</a><button class="btn danger" id="logout" type="button">Log Out</button></div></section></main><div id="bottom"></div><script src="config.js"></script><script type="module">import{guard,api,nav,logout,currentUser}from'./scripts/common.js';if(guard('client')){document.getElementById('bottom').innerHTML=nav('account');document.getElementById('logout').onclick=logout;const u=currentUser();try{const d=await api('/client/dashboard'),p=d.profile||{};name.textContent=p.name||u.name||'Client';uid.textContent=p.id||u.id||'—';invite.textContent=p.inviteCode||'—';credit.textContent=p.creditScore??1000;commission.textContent='USD '+Number(p.commissionBalance||0).toFixed(2)}catch(e){console.error(e)}}}</script></body></html>
