<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050a10"><title>BoxOffice Mojo — Wallet</title><link rel="icon" href="favicon.ico"><link rel="stylesheet" href="styles/app.css"></head><body class="app-shell"><header class="topbar client-header"><img src="assets/brand-logo.png" class="brand-mini" alt="Box Office Mojo by IMDbPro"></header><main class="container client-content"><div class="section-head"><div><span class="kpi">Finance</span><h1 class="section-title">Wallet</h1></div></div><section class="wallet-grid"><div class="wallet-stat"><span class="kpi">Asset Balance</span><b id="balance">USD 0.00</b></div><div class="wallet-stat"><span class="kpi">Commission</span><b id="commission">USD 0.00</b></div></section><section class="card" style="margin-top:14px"><span class="kpi">Secure transactions</span><h2 style="margin:7px 0 0">Request Funds</h2><div class="grid grid-2" style="margin-top:8px"><form id="deposit"><label class="field"><span>Deposit Amount</span><input class="light-input" name="amount" type="number" min="1" step="0.01" placeholder="0.00" required></label><button class="btn" type="submit">Request Deposit</button></form><form id="withdraw"><label class="field"><span>Withdraw Amount</span><input class="light-input" name="amount" type="number" min="1" step="0.01" placeholder="0.00" required></label><button class="btn secondary" type="submit">Request Withdraw</button></form></div><div id="msg" class="notice" style="display:none;margin-top:14px"></div></section></main><div id="bottom"></div><script src="config.js"></script><script type="module">import{guard,api,nav}from'./scripts/common.js';if(guard('client')){document.getElementById('bottom').innerHTML=nav('wallet');const load=async()=>{try{const d=await api('/client/wallet');balance.textContent='USD '+Number(d.assetBalance||0).toFixed(2);commission.textContent='USD '+Number(d.commissionBalance||0).toFixed(2)}catch(e){msg.textContent=e.message;msg.className='notice error';msg.style.display='block'}};const submit=(form,type)=>form.onsubmit=async e=>{e.preventDefault();try{await api('/client/wallet/requests',{method:'POST',body:JSON.stringify({type,amount:Number(new FormData(form).get('amount'))})});msg.textContent='Request submitted successfully.';msg.className='notice success';msg.style.display='block';form.reset();await load()}catch(e){msg.textContent=e.message;msg.className='notice error';msg.style.display='block'}};submit(deposit,'deposit');submit(withdraw,'withdraw');load()}}</script></body></html>
