<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050a10"><title>BoxOffice Mojo — Dashboard</title><link rel="icon" href="favicon.ico"><link rel="stylesheet" href="styles/app.css"><script>try{const u=JSON.parse(localStorage.getItem('bo_user')||sessionStorage.getItem('bo_user')||'null'),t=localStorage.getItem('bo_token')||sessionStorage.getItem('bo_token');if(!u||u.role!=='client'||!t)location.replace('login.html')}catch{location.replace('login.html')}</script></head><body class="app-shell" data-active="home"><header class="topbar client-header"><img src="logo.png" class="brand-mini" alt="Box Office Mojo by IMDbPro"></header><main class="container client-content"><section class="client-profile"><img src="logo.png" class="client-avatar" alt="Box Office Mojo"><div><span class="kpi">Client Dashboard</span><h1 id="name" style="margin:6px 0 5px;font-size:clamp(22px,4vw,30px)">Client</h1><span class="muted">Credit Score <b id="credit">1000</b></span></div></section><div class="wallet-grid" style="margin-top:14px"><div class="wallet-stat"><span class="kpi">Balance</span><b id="balance">USD 0.00</b></div><div class="wallet-stat"><span class="kpi">Commission</span><b id="commission">USD 0.00</b></div><div class="wallet-stat"><span class="kpi">Tasks</span><b id="tasks">0 / 30</b></div><div class="wallet-stat"><span class="kpi">Daily Profit</span><b id="profit">USD 0.00</b></div></div><section class="card" style="margin-top:14px"><div class="section-head"><div><span class="kpi">Professional Data Optimization Services</span><h2 style="margin:7px 0 0;font-size:clamp(22px,3vw,30px)">Account Overview</h2></div><a class="btn" href="wallet.html">Open Wallet</a></div><p class="muted" style="margin:14px 0 0;line-height:1.7">Manage your balance, optimization tasks and activity securely from one client dashboard.</p></section></main><div id="bottom"></div><script src="config.js"></script><script type="module">import{guard,api,nav}from'./scripts/common.js';const u=guard('client');if(u){document.getElementById('bottom').innerHTML=nav('home');try{const d=await api('/client/dashboard');document.getElementById('name').textContent=d.profile?.name||u.name||'Client';document.getElementById('credit').textContent=d.profile?.creditScore??1000;document.getElementById('balance').textContent='USD '+Number(d.stats?.assetBalance||0).toFixed(2);document.getElementById('commission').textContent='USD '+Number(d.stats?.commission||0).toFixed(2);document.getElementById('tasks').textContent=`${d.stats?.taskCount||0} / ${d.stats?.totalTasks||30}`;document.getElementById('profit').textContent='USD '+Number(d.stats?.dailyProfit||0).toFixed(2)}catch(e){console.error(e)}}</script></body></html>
