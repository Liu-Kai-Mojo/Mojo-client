<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050a10"><title>BoxOffice Mojo — History</title><link rel="icon" href="favicon.ico"><link rel="stylesheet" href="styles/app.css"></head><body class="app-shell"><header class="topbar client-header"><img src="assets/brand-logo.png" class="brand-mini" alt="Box Office Mojo by IMDbPro"></header><main class="container client-content"><div class="section-head"><div><span class="kpi">Activity</span><h1 class="section-title">History</h1></div></div><section class="card"><div id="rows" class="history-list"></div></section></main><div id="bottom"></div><script src="config.js"></script><script type="module">import{guard,api,nav}from'./scripts/common.js';if(guard('client')){document.getElementById('bottom').innerHTML=nav('history');try{const list=await api('/client/history');rows.innerHTML=list.map(o=>`<div class="history-row"><div><b>${o.title||'Transaction'}</b><small>${new Date(o.createdAt).toLocaleString()} • ${o.status||'pending'}</small></div><span class="amount">USD ${Number(o.amount||0).toFixed(2)}</span></div>`).join('')||'<div class="empty">No history records yet.</div>'}catch(e){rows.innerHTML=`<div class="notice error">${e.message}</div>`}}}</script></body></html>
